<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex, nofollow">
 <title>Campanella · CRM e Matrículas V7.0 · Gestão multi-escolas</title>
 <link rel="icon" type="image/png" href="./assets/img/logo-icon-color.png">
 <link rel="apple-touch-icon" href="./assets/img/logo-icon-color.png">
 <script>
  (function() {
    try {
      var saved = localStorage.getItem('campanella:theme');
      var mode = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var resolved = (mode === 'light' || mode === 'dark') ? mode : (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.setAttribute('data-theme-mode', mode);
      document.documentElement.style.colorScheme = resolved;
    } catch(e) {}
  })();
 </script>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="./css/style.css?v=7.2.3">
 <link rel="stylesheet" href="./css/crm.css?v=6.18.1">
 <link rel="stylesheet" href="./css/calendar-v6.css?v=6.14.0">
 <link rel="stylesheet" href="./css/onboarding-v67.css?v=6.10.0">
 <link rel="stylesheet" href="./css/vision-theme.css?v=7.2.6">
 <script defer src="https://unpkg.com/pizzip@3.2.0/dist/pizzip.js"></script>
 <script defer src="https://unpkg.com/docxtemplater@3.71.0/build/docxtemplater.js"></script>
 <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
 <script>
  // Watchdog de inicialização: impede tela de carregamento infinita em caso de falhas ou bloqueios
  window.addEventListener('error', function(event) {
   var app = document.getElementById('app');
   if (app && app.querySelector('.boot')) {
    console.error('Falha de inicialização detectada:', event.error || event.message);
    var msg = event.message || (event.error && event.error.message) || 'Erro ao processar scripts da plataforma.';
    app.innerHTML = '<div class="boot" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">' +
     '<div style="max-width:440px;width:100%;background:rgba(22,27,34,0.95);border:1px solid rgba(248,81,73,0.4);border-radius:14px;padding:28px 24px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,0.4);color:#e6edf3;font-family:sans-serif;">' +
      '<div style="font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#f85149;margin-bottom:8px;">Falha no carregamento</div>' +
      '<h2 style="font-size:18px;margin:0 0 10px 0;font-weight:700;">Não foi possível iniciar o painel</h2>' +
      '<p style="font-size:13px;color:#8b949e;margin:0 0 20px 0;line-height:1.5;">' + msg + '</p>' +
      '<div style="display:flex;flex-direction:column;gap:10px;">' +
       '<button onclick="location.reload()" style="background:#238636;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Recarregar página</button>' +
       '<button onclick="localStorage.clear();sessionStorage.clear();location.reload(true)" style="background:transparent;color:#8b949e;border:1px solid #30363d;padding:9px 16px;border-radius:8px;font-size:12px;cursor:pointer;">Limpar cache local e recarregar</button>' +
      '</div>' +
     '</div>' +
    '</div>';
   }
  });
  setTimeout(function() {
   var app = document.getElementById('app');
   if (app && app.querySelector('.boot')) {
    var card = app.querySelector('.boot-card');
    if (card && !app.querySelector('.boot-retry-hint')) {
     var hint = document.createElement('div');
     hint.className = 'boot-retry-hint';
     hint.style.cssText = 'margin-top:16px;text-align:center;font-size:12px;color:#8b949e;line-height:1.4;';
     hint.innerHTML = 'Conectando aos serviços... Se demorar, <a href="javascript:location.reload()" style="color:#58a6ff;text-decoration:underline;">clique aqui para recarregar</a>.';
     card.appendChild(hint);
    }
   }
  }, 8000);
 </script>
 <script type="module" src="./js/app.js?v=7.2.3"></script>
</head>
<body>
 <div id="app" aria-live="polite">
  <div class="boot">
   <div class="boot-orb boot-orb-1" aria-hidden="true"></div>
   <div class="boot-orb boot-orb-2" aria-hidden="true"></div>
   <div class="boot-orb boot-orb-3" aria-hidden="true"></div>
   <div class="boot-card">
    <div class="boot-emblem-wrap">
     <img class="boot-mark brand-logo-light" src="./assets/img/logo-icon-color.png" alt="Campanella">
     <img class="boot-mark brand-logo-dark" src="./assets/img/logo-icon-white.png" alt="Campanella">
    </div>
    <div class="boot-progress-wrap" aria-hidden="true"><div class="boot-bar"></div></div>
   </div>
  </div>
 </div>
 <dialog id="modal" aria-label="Janela de edição"><button class="close" data-action="close" aria-label="Fechar">×</button><div id="modal-body"></div></dialog>
 <div id="busyOverlay" hidden aria-hidden="true"><div class="busy-card" role="status" aria-live="polite"><span class="busy-wheel" aria-hidden="true"></span><span data-busy-label>Processando sua solicitação...</span></div></div>
 <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
