<!doctype html>
<html lang="pt-BR" data-theme="light" data-theme-mode="light" style="color-scheme: light;">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex, nofollow">
 <title>Campanella · CRM e Matrículas</title>
 <link rel="icon" type="image/png" href="./assets/img/logo-icon-color.png">
 <link rel="apple-touch-icon" href="./assets/img/logo-icon-color.png">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700;900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="./css/style.css?v=8.0.3">
 <link rel="stylesheet" href="./css/crm.css?v=8.0.3">
 <link rel="stylesheet" href="./css/calendar-v6.css?v=8.0.3">
 <link rel="stylesheet" href="./css/onboarding-v67.css?v=8.0.3">
 <script defer src="https://unpkg.com/pizzip@3.2.0/dist/pizzip.js"></script>
 <script defer src="https://unpkg.com/docxtemplater@3.71.0/build/docxtemplater.js"></script>
 <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
 <script>
  window.addEventListener('error', function(event) {
   var app = document.getElementById('app');
   if (app && app.querySelector('.boot')) {
    console.error('Falha de inicialização detectada:', event.error || event.message);
    var msg = event.message || (event.error && event.error.message) || 'Erro ao processar scripts da plataforma.';
    app.innerHTML = '<div class="boot" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:#F2F2F2;">' +
     '<div style="max-width:420px;width:100%;background:#ffffff;border:1px solid #EAECF0;border-radius:16px;padding:28px;text-align:center;box-shadow:0 8px 24px rgba(29,41,57,0.08);color:#1D2939;font-family:Lato,sans-serif;">' +
      '<div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#EB5757;margin-bottom:8px;">Falha no carregamento</div>' +
      '<h2 style="font-size:18px;margin:0 0 8px 0;font-weight:700;">Não foi possível iniciar o painel</h2>' +
      '<p style="font-size:14px;color:#475467;margin:0 0 20px 0;line-height:1.4;">' + msg + '</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
       '<button onclick="location.reload()" style="background:#5082E5;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;">Recarregar página</button>' +
       '<button onclick="localStorage.clear();sessionStorage.clear();location.reload(true)" style="background:#ffffff;color:#1D2939;border:1px solid #D0D5DD;padding:10px 16px;border-radius:6px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;">Limpar cache local e recarregar</button>' +
      '</div>' +
     '</div>' +
    '</div>';
   }
  });
  setTimeout(function() {
   var app = document.getElementById('app');
   if (app && app.querySelector('.boot')) {
    var card = app.querySelector('.boot-card');
    if (card && !app.querySelector('.boot-retry-hint')) {
     var hint = document.createElement('div');
     hint.className = 'boot-retry-hint';
     hint.style.cssText = 'margin-top:14px;text-align:center;font-size:12px;color:#64748b;line-height:1.4;';
     hint.innerHTML = 'Conectando aos serviços... Se demorar, <a href="javascript:location.reload()" style="color:#ea580c;text-decoration:underline;">clique aqui para recarregar</a>.';
     card.appendChild(hint);
    }
   }
  }, 8000);
 </script>
 <script type="module" src="./js/app.js?v=8.0.2"></script>
</head>
<body>
 <div id="app" aria-live="polite">
  <div class="boot">
   <div class="boot-card">
    <div class="boot-emblem-wrap">
     <img class="boot-mark brand-logo-light" src="./assets/img/logo-icon-color.png" alt="Campanella">
    </div>
    <div class="boot-progress-wrap" aria-hidden="true"><div class="boot-bar"></div></div>
   </div>
  </div>
 </div>
 <dialog id="modal" aria-label="Janela de edição"><button class="close" data-action="close" aria-label="Fechar">×</button><div id="modal-body"></div></dialog>
 <div id="busyOverlay" hidden aria-hidden="true"><div class="busy-card" role="status" aria-live="polite"><span class="busy-wheel" aria-hidden="true"></span><span data-busy-label>Processando sua solicitação...</span></div></div>
 <div id="toast" popover="manual" role="status" aria-live="polite"></div>
</body>
</html>
